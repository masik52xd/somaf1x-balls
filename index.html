<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Escape — Shorts Studio</title>
<style>
:root{--bg:#07070f;--fg:#f3f0ff;--card:rgba(20,18,36,.88);--bd:rgba(255,255,255,.16);--ac:#c9b6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#020205;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%}
canvas.vert{width:auto;height:100%;max-width:100vw;max-height:100vh;aspect-ratio:9/16;box-shadow:0 0 30px rgba(0,0,0,.8)}
#gear{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer;z-index:2}
#ui{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 20px));background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:7px;font-size:14px;z-index:2;max-height:78vh;overflow-y:auto}
#ui.hide{display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.b{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
button.b.on{background:var(--ac);color:#1a1530;border-color:var(--ac);font-weight:700}
button.b.rec{background:#e11d48;border-color:#fb7185;color:#fff;font-weight:700}
input[type=number],input[type=text]{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:6px 9px;font-size:13px;min-width:0}
input[type=number]{width:66px}input[type=text]{flex:1}
label{display:flex;gap:4px;align-items:center;cursor:pointer;font-size:13px}
</style></head><body>
<canvas id="c"></canvas>
<button id="gear" title="Меню">⚙</button>
<div id="ui">
 <div class="row"><span>Секунд:</span><input id="sec" type="number" min="3" max="600" value="30">
  <button class="b chip" data-s="10">10</button><button class="b chip" data-s="15">15</button><button class="b chip" data-s="30">30</button><button class="b chip" data-s="60">60</button></div>
 <div class="row" id="modes">
  <button class="b on" data-m="rings">◎ Кільця</button>
  <button class="b" data-m="grow">⬤ Росте</button>
  <button class="b" data-m="dbl">⇄ Дві діри</button>
  <button class="b" data-m="speed">⚡ Турбо</button>
  <button class="b" data-m="flip">🔄 Реверс</button>
  <button class="b" data-m="clone">✴ Клони</button>
  <button class="b" data-m="duel">⚔ Дуель</button>
  <button class="b" data-m="grav">🌀 Граві-фліп</button>
  <button class="b" data-m="hits">💥 Пробій</button>
 </div>
 <div class="row" id="presets">
  <span>Шари:</span>
  <button class="b on" data-d="1">1x</button>
  <button class="b" data-d="1.9">2x</button>
  <button class="b" data-d="2.9">3x</button>
  <button class="b" id="bamBtn">💥 Бам-реверс</button>
  <button class="b" id="spiralBtn">🌀 Спіраль</button>
 </div>
 <div class="row">
  <input id="title" type="text" value="THE BALL HAS {T} SECONDS TO ESCAPE">
  <button class="b" id="hookBtn" title="Змінити вірусний заголовок">🎲 Хук</button>
 </div>
 <div class="row">
  <button class="b" id="col">🎨 Кольори</button>
  <button class="b" id="rst">↻ Заново</button>
  <label><input type="checkbox" id="vert">9:16 (1080p)</label>
  <label><input type="checkbox" id="snd" checked>Звук</label>
  <label><input type="checkbox" id="auto" checked>Автоповтор</label>
  <label><input type="checkbox" id="mix">Мікс</label>
 </div>
 <div class="row" id="recRow">
  <button class="b" id="recBtn">⏺ Запис</button>
  <button class="b on" data-rm="one">1 файл</button>
  <button class="b" data-rm="join">Все в 1</button>
  <button class="b" data-rm="multi">Кілька файлів</button>
 </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,PI=Math.PI,G=1.85;
let DT=1/120;
const M={
 rings:{g:1,w:.68,dw:.032,br:.032,grow:0,alt:0},
 grow: {g:1,w:.62,dw:.034,br:.024,grow:1,alt:0},
 dbl:  {g:2,w:.64,dw:.028,br:.030,grow:0,alt:1},
 speed:{g:1,w:.66,dw:.030,br:.030,grow:0,alt:0,speed:1},
 flip: {g:1,w:.72,dw:.030,br:.032,grow:0,alt:1,flip:1},
 clone:{g:1,w:.64,dw:.030,br:.026,grow:0,alt:0,clone:1},
 duel: {g:1,w:.64,dw:.030,br:.030,grow:0,alt:1,duel:1},
 grav: {g:1,w:.64,dw:.030,br:.032,grow:0,alt:0,grav:1},
 hits: {g:0,w:.48,dw:.022,br:.034,grow:0,alt:0,hits:1}
};
const MODE_KEYS=Object.keys(M);
const DUEL_COLS=['#22f3ff','#ff3d9a'],DUEL_NAMES=['CYAN','PINK'];
const HOOKS={
 rings:['THE BALL HAS {T} SECONDS TO ESCAPE','WAIT FOR THE END... ({T}s)','WILL IT ESCAPE IN {T} SECONDS?'],
 grow: ['BALL GROWS UNTIL IT ESCAPES ({T}s)','WATCH IT GROW TO THE MAX! ({T}s)','CAN IT FIT THROUGH IN {T}s?'],
 dbl:  ['2 GAPS, {T} SECONDS TO ESCAPE','DOUBLE GAP CHALLENGE ({T}s)','CAN IT BEAT THE SPIN IN {T}s?'],
 speed:['EVERY BOUNCE = FASTER! ({T}s)','SPEED GOES INSANE AT THE END','TURBO ESCAPE IN {T} SECONDS'],
 flip: ['EVERY BOUNCE REVERSES SPIN!','WAIT FOR THE CLUTCH! ({T}s)','IMPOSSIBLE REVERSE RINGS ({T}s)'],
 clone:['EVERY RING = +1 BALL! ({T}s)','WAIT FOR THE CHAOS AT THE END','1 BALL TURNS INTO 10! ({T}s)'],
 duel: ['CYAN VS PINK — WHO WINS?','PICK YOUR COLOR BEFORE IT STARTS!','WHO ESCAPES IN {T} SECONDS?'],
 grav: ['GRAVITY SHIFTS EVERY RING! ({T}s)','BRAIN MELTING GRAVITY ({T}s)','CAN IT ESCAPE 4D GRAVITY?'],
 hits: ['BREAK ALL RINGS IN {T} SECONDS!','NO GAPS! SMASH TO ESCAPE ({T}s)','SATISFYING RING BREAKER ({T}s)']
};
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,987.77,1046.5];
const S={mode:'rings',T:30,t:0,state:'run',done:0,j:0,acc:0,note:0,vidCount:0,spdMult:1,gAng:PI/2,winner:-1,eMult:1,hookIdx:0,autoHook:false,dens:1,bam:false,spiral:false};
let W,H,R,cx,cy,dpr,rings=[],balls=[],pal={},parts=[],waves=[],shake=0,bamPulse=0,n=12,rin=.22,sp=0,th=.016,brMin=.03,brMax=.08;
let actx=null,recDest=null,mr=null,recChunks=[],recording=false,recStopping=false,manualStop=false,recMode='one';

const wk=new Worker(URL.createObjectURL(new Blob([`
 let id=null;
 onmessage=e=>{
  if(e.data==='start'&&!id)id=setInterval(()=>postMessage(0),1000/60);
  if(e.data==='stop'&&id){clearInterval(id);id=null;}
 };
`],{type:'application/javascript'})));

function resize(){
 if($('vert').checked){
  cv.classList.add('vert');
  dpr=2;W=540;H=960;
  cv.width=1080;cv.height=1920;
 }else{
  cv.classList.remove('vert');
  dpr=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
 }
 ctx.setTransform(dpr,0,0,dpr,0,0);
 R=Math.min(W*.43,H*.29);cx=W/2;cy=H*.50;
}

function newPal(){
 const h=Math.random()*360,d=(Math.random()<.5?-1:1)*(45+Math.random()*95);
 pal={h1:h,h2:h+d,s:74+Math.random()*18,l:66+Math.random()*14,ball:`hsl(${h},92%,68%)`,bg:'#04040a',acc:`hsl(${h},95%,65%)`};
}
const col=k=>`hsl(${pal.h1+(pal.h2-pal.h1)*k},${pal.s}%,${pal.l}%)`;

function applyHook(next){
 const list=HOOKS[S.mode]||HOOKS.rings;
 if(next)S.hookIdx=(S.hookIdx+1)%list.length;
 else S.hookIdx=S.hookIdx%list.length;
 $('title').value=list[S.hookIdx];
}

function setModeUI(m){
 S.mode=m;
 document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x.dataset.m===m));
 if(S.autoHook)applyHook(false);
}

function unlockAudio(){
 if(!actx){
  try{
   actx=new (window.AudioContext||window.webkitAudioContext)();
   recDest=actx.createMediaStreamDestination();
   const ko=actx.createOscillator(),kg=actx.createGain();
   ko.frequency.value=20;kg.gain.value=.00001;
   ko.connect(kg);kg.connect(actx.destination);ko.start();
  }catch(e){}
 }
 if(actx&&actx.state==='suspended')actx.resume();
 if('wakeLock' in navigator&&!document.hidden){navigator.wakeLock.request('screen').catch(()=>{})}
}

function tone(f,dur=.14,vol=.09,type='sine'){
 if(!$('snd').checked||!actx)return;
 const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(vol,t);
 g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(g);g.connect(actx.destination);
 if(recDest)g.connect(recDest);
 o.start(t);o.stop(t+dur+.01);
}

function thump(vol=.08){
 if(!$('snd').checked||!actx)return;
 const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
 o.type='sine';o.frequency.setValueAtTime(105,t);o.frequency.exponentialRampToValueAtTime(34,t+.12);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
 o.connect(g);g.connect(actx.destination);
 if(recDest)g.connect(recDest);
 o.start(t);o.stop(t+.14);
}

function ringBurst(rObj,m,color){
 const c0=rObj.a,count=S.dens>2?42:68;
 waves.push({r:rObj.r,maxR:rObj.r+.22,l:1,c:color});
 shake=Math.min(10,shake+(S.bam?4.5:3.0));
 if(S.bam)bamPulse=1;
 for(let i=0;i<count;i++){
  const a=Math.random()*TAU;let skip=false;
  for(let g=0;g<m.g;g++){let df=a-(c0+g*TAU/m.g);df-=TAU*Math.round(df/TAU);if(Math.abs(df)<rObj.hv){skip=true;break}}
  if(skip)continue;
  const spd=.16+Math.random()*.48;
  parts.push({x:Math.cos(a)*rObj.r,y:Math.sin(a)*rObj.r,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,l:1,fade:1.4+Math.random()*.8,sz:1.4+Math.random()*1.7,c:color});
 }
}

function sparkBurst(x,y,c,v,cl,sz=1.8){
 for(let i=0;i<c;i++){
  const a=Math.random()*TAU,s=v*(.25+Math.random()*.9);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,fade:1.5+Math.random()*.8,sz,c:cl||col(Math.random())});
 }
}

function makeSim(cfg){
 const m=M[S.mode],rs=[];
 for(let i=0;i<n;i++){
  const dir=m.alt?(i%2?1:-1)*cfg.dir:cfg.dir;
  const maxHp=m.hits?Math.max(1,Math.round(cfg.hpBase*(.72+.55*(1-i/Math.max(1,n-1))))):1;
  rs.push({r:rin+sp*(i+1),k:i/Math.max(1,n-1),a:cfg.a0+i*cfg.phase,w:dir*(cfg.w+(n-1-i)*cfg.dw),hv:cfg.hv,broken:false,flash:0,hp:maxHp,maxHp});
 }
 const bs=[{x:Math.cos(cfg.bPos)*cfg.bDist,y:Math.sin(cfg.bPos)*cfg.bDist,vx:Math.cos(cfg.bAng)*cfg.bSpd,vy:Math.sin(cfg.bAng)*cfg.bSpd,r:brMin,tr:brMin,colIdx:0,trail:[]}];
 if(m.duel){
  const a2=cfg.bAng+2.1;
  bs.push({x:-bs[0].x,y:-bs[0].y,vx:Math.cos(a2)*cfg.bSpd,vy:Math.sin(a2)*cfg.bSpd,r:brMin,tr:brMin,colIdx:1,trail:[]});
 }
 return {rs,bs,j:0,t:0,spdMult:1,gAng:PI/2,winner:-1,eMult:cfg.eMult||1};
}

function onLayerBreak(sim,rg,b,m,fx){
 rg.broken=true;sim.j++;
 if(m.grow)b.tr=brMin+(brMax-brMin)*(sim.j/n);
 if(m.grav)sim.gAng+=PI/2;
 if(S.bam){for(let k=sim.j;k<n;k++)sim.rs[k].w=-sim.rs[k].w}
 if(m.clone&&sim.bs.length<10){
  const spAng=.42*(sim.bs.length%2?1:-1),cs=Math.cos(spAng),sn=Math.sin(spAng);
  sim.bs.push({x:b.x*.97,y:b.y*.97,vx:b.vx*cs-b.vy*sn,vy:b.vx*sn+b.vy*cs,r:b.r,tr:b.tr,colIdx:(sim.bs.length)%2,trail:[]});
 }
 if(fx){
  const cCol=m.duel?DUEL_COLS[b.colIdx]:col(rg.k);
  ringBurst(rg,m,cCol);
  tone(520+Math.min(sim.j,25)*24,.16,.095,'triangle');
  thump(S.bam?.13:.075);
 }
}

function simStep(sim,dt,fx){
 const m=M[S.mode];
 sim.t+=dt;
 const wMul=m.speed?(1+(sim.spdMult-1)*.65):1;
 for(let i=sim.j;i<n;i++)sim.rs[i].a+=sim.rs[i].w*wMul*dt;
 const gx=Math.cos(sim.gAng)*G,gy=Math.sin(sim.gAng)*G;

 if(m.duel&&sim.bs.length===2){
  const b0=sim.bs[0],b1=sim.bs[1];
  const dx=b1.x-b0.x,dy=b1.y-b0.y,dist=Math.hypot(dx,dy),minD=b0.r+b1.r;
  if(dist>1e-5&&dist<minD){
   const nx=dx/dist,ny=dy/dist,ov=(minD-dist)*.5;
   b0.x-=nx*ov;b0.y-=ny*ov;b1.x+=nx*ov;b1.y+=ny*ov;
   const rvx=b1.vx-b0.vx,rvy=b1.vy-b0.vy,vn=rvx*nx+rvy*ny;
   if(vn<0){
    b0.vx+=vn*nx;b0.vy+=vn*ny;b1.vx-=vn*nx;b1.vy-=vn*ny;
    if(fx){sparkBurst((b0.x+b1.x)*.5,(b0.y+b1.y)*.5,7,.5,'#fff',1.5);tone(NOTES[(S.note++)%NOTES.length]*1.25,.07,.055,'triangle')}
   }
  }
 }

 for(let bi=0;bi<sim.bs.length;bi++){
  const b=sim.bs[bi];
  b.vx+=gx*dt;b.vy+=gy*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  b.r+=(b.tr-b.r)*Math.min(1,dt*8);

  while(sim.j<n){
   const rg=sim.rs[sim.j],rho=rg.r-th*.5-b.r,d=Math.hypot(b.x,b.y);
   if(d<rho)break;
   const ang=Math.atan2(b.y,b.x),gapEff=Math.max(.06,rg.hv-(b.r/rg.r)*.48);
   let inGap=false;
   for(let g=0;g<m.g;g++){
    const c=rg.a+g*TAU/m.g;
    let df=ang-c;df-=TAU*Math.round(df/TAU);
    if(Math.abs(df)<gapEff){inGap=true;break}
   }
   if(inGap){
    if(d>=rg.r){onLayerBreak(sim,rg,b,m,fx);continue}
    break;
   }
   if(d>1e-5){
    const nx=b.x/d,ny=b.y/d;b.x=nx*rho;b.y=ny*rho;
    const vn=b.vx*nx+b.vy*ny;
    if(vn>0){
     b.vx-=2*vn*nx;b.vy-=2*vn*ny;
     const tx=-ny,ty=nx;b.vx+=tx*rg.w*wMul*rg.r*.03;b.vy+=ty*rg.w*wMul*rg.r*.03;
     if(m.speed)sim.spdMult=Math.min(2.15,sim.spdMult+.045);
     if(m.flip){for(let k=sim.j;k<n;k++)sim.rs[k].w=-sim.rs[k].w}
     const pot=gx*b.x+gy*b.y,K=.5*(b.vx*b.vx+b.vy*b.vy),E=K+pot;
     const Et=(.85+1.85*rg.r)*(m.speed?sim.spdMult*sim.spdMult:1)*sim.eMult;
     const Kn=Math.max(.25,E+(Et-E)*.38-pot);
     if(K>1e-5){const sc=Math.sqrt(Kn/K);b.vx*=sc;b.vy*=sc}
     if(m.hits){
      rg.hp--;
      if(rg.hp<=0){onLayerBreak(sim,rg,b,m,fx);continue}
     }
     if(fx){
      rg.flash=1;
      const spCol=m.duel?DUEL_COLS[b.colIdx]:col(rg.k);
      sparkBurst(b.x+nx*b.r,b.y+ny*b.r,6,.48,spCol,1.45);
      const pitchMul=m.speed?(1+(sim.spdMult-1)*.35):(m.duel?(b.colIdx?.85:1.12):1);
      tone(NOTES[S.note%NOTES.length]*pitchMul,.11,.07,'sine');S.note++;
     }
    }
   }
   break;
  }
  if(sim.j>=n&&sim.winner<0&&Math.hypot(b.x,b.y)>1.08)sim.winner=bi;
 }
}

function findPlan(){
 const m=M[S.mode];
 DT=S.dens>1?1/180:1/120;
 const nBase=m.hits?Math.max(4,Math.min(13,Math.round(3+S.T*.24))):Math.max(4,Math.min(20,Math.round(3+S.T*.28)));
 n=Math.min(m.hits?28:48,Math.max(4,Math.round(nBase*S.dens)));
 rin=S.dens>1?.17:.22;
 sp=(1-rin)/n;
 th=Math.min(.018,sp*(S.dens>2?.40:.34));
 brMin=Math.min(m.br,Math.max(.015,sp*1.15));
 brMax=m.grow?Math.min(.095,Math.max(.05,sp*1.4)):brMin;

 const avgR=(rin+1)*.5,pNeed=n*(1.1*avgR/1.75)/Math.max(2,S.T*.9);
 const minHv=m.g===2?.12:(S.T>=40?.13:.17);
 const maxHv=m.g===2?.62:(S.dens>1?1.25:.78);
 let baseHv=Math.max(minHv,Math.min(maxHv*.85,(pNeed*PI/Math.max(1,m.g))+(brMin+brMax)*.25/avgR));
 if(m.grow)baseHv=Math.max(baseHv,S.T>=45?.22:.30);
 if(m.duel||m.clone)baseHv=Math.max(.13,baseHv*.70);
 if(m.speed)baseHv=Math.max(.14,baseHv*.76);
 const hpTarget=m.hits?Math.max(1,(S.T*2.1)/n):1;

 let best=null,bestScore=1e9,tries=0;
 const tStart=performance.now(),targetT=Math.max(S.T*.72,S.T-1.8),tBudget=(m.clone||m.duel||S.dens>1||S.T>45)?75:38;
 for(let pass=0;pass<4&&(!best||bestScore>S.T*.18);pass++){
  const hvMult=pass===0?1:(pass===1?.72:(pass===2?1.32:1.75));
  for(let s=0;s<40;s++){
   if(tries>=10&&best&&bestScore<1000&&performance.now()-tStart>tBudget)break;
   if(performance.now()-tStart>180&&best)break;
   tries++;
   const phaseVal=S.spiral?(Math.random()<.5?1:-1)*(.14+Math.random()*.20):(Math.random()-.5)*.06;
   const eBase=m.hits?(.75+Math.random()*.8):(S.dens>1?(1+(S.dens-1)*.24+Math.random()*.35):1);
   const cfg={
    dir:Math.random()<.5?1:-1,
    a0:Math.random()*TAU,
    phase:phaseVal,
    w:m.w*(.82+Math.random()*.36),
    dw:m.dw*(S.spiral?.22:(.8+Math.random()*.4))*(S.dens>1?.55:1),
    hv:m.hits?0:Math.min(maxHv,Math.max(.11,baseHv*hvMult*(.82+Math.random()*.36))),
    bPos:Math.random()*TAU,
    bDist:m.duel?Math.max(brMin*1.45,Math.random()*rin*.42):Math.random()*rin*.35,
    bAng:Math.random()*TAU,
    bSpd:(1.15+Math.random()*.5)*(S.dens>1?1.15:1),
    hpBase:hpTarget*(pass===3?.5:(.65+Math.random()*.7)),
    eMult:eBase
   };
   const sim=makeSim(cfg),maxT=S.T*1.02,breaks=[];let prevJ=0;
   while(sim.t<maxT&&sim.winner<0){
    simStep(sim,DT,false);
    if(sim.j>prevJ){while(prevJ<sim.j){breaks.push(sim.t);prevJ++}}
   }
   let score;
   if(sim.j===n&&sim.winner>=0){
    const dtErr=Math.abs(sim.t-targetT),maxGap=breaks.reduce((mx,t,i)=>Math.max(mx,t-(i?breaks[i-1]:0)),0);
    score=dtErr+(maxGap>S.T*.45?(maxGap-S.T*.45)*2:0)+(sim.t>S.T*.98?S.T*.25:0);
   }else score=1000+(n-sim.j)*50;
   if(score<bestScore){bestScore=score;best=cfg}
   if(score<S.T*.05)break;
  }
 }
 return best;
}

function start(np){
 if(np)newPal();
 S.T=Math.max(3,+$('sec').value||30);
 const sim=makeSim(findPlan());
 rings=sim.rs;balls=sim.bs;S.j=0;S.t=0;S.acc=0;S.state='run';S.done=0;S.note=0;
 S.spdMult=1;S.gAng=PI/2;S.winner=-1;S.eMult=sim.eMult;
 parts=[];waves=[];shake=0;bamPulse=0;
}

function nextRound(){
 if($('mix').checked){
  const others=MODE_KEYS.filter(k=>k!==S.mode);
  const nextM=others[Math.floor(Math.random()*others.length)];
  S.autoHook=true;
  setModeUI(nextM);
 }
 start(true);
}

function finish(winIdx){
 S.state='done';S.done=0;S.winner=winIdx;
 const wb=balls[winIdx]||balls[0];
 const fc=M[S.mode].duel?DUEL_COLS[wb.colIdx]:null;
 shake=10;bamPulse=1;
 sparkBurst(wb.x,wb.y,140,1.7,fc);
 tone(523.25,.18,.11,'triangle');thump(.11);
 setTimeout(()=>tone(659.25,.18,.11,'triangle'),90);
 setTimeout(()=>tone(783.99,.25,.12,'triangle'),180);
 setTimeout(()=>tone(1046.5,.38,.13,'triangle'),270);
}

function startRec(){
 unlockAudio();
 if(recording)return;
 manualStop=false;
 if($('mix').checked)nextRound();else start(true);
 const mimes=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
 const tracks=[...cv.captureStream(60).getVideoTracks()];
 if(recDest)tracks.push(...recDest.stream.getAudioTracks());
 recChunks=[];
 mr=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});
 mr.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
 mr.onstop=()=>{
  recording=false;recStopping=false;
  $('recBtn').classList.remove('rec');$('recBtn').textContent='⏺ Запис';
  const ext=mime.includes('mp4')?'mp4':'webm';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(recChunks,{type:mime||'video/webm'}));
  a.download=`ball-escape-${S.mode}-${++S.vidCount}.${ext}`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),15000);
  if(recMode==='multi'&&!manualStop)startRec();
 };
 mr.start(250);
 recording=true;recStopping=false;
 $('recBtn').classList.add('rec');$('recBtn').textContent='⏹ Стоп';
}

function stopRec(isManual){
 if(isManual)manualStop=true;
 if(mr&&mr.state==='recording'&&!recStopping){recStopping=true;mr.stop()}
}

function step(dt){
 S.acc+=dt;
 const sim={rs:rings,bs:balls,j:S.j,t:S.t,spdMult:S.spdMult,gAng:S.gAng,winner:S.winner,eMult:S.eMult};
 while(S.acc>=DT){
  simStep(sim,DT,true);S.acc-=DT;
  if(S.state==='run'&&sim.winner>=0){
   S.j=sim.j;S.t=sim.t;S.spdMult=sim.spdMult;S.gAng=sim.gAng;
   finish(sim.winner);return;
  }
  if(S.state==='run'&&sim.t>=S.T){
   const m=M[S.mode];
   for(let i=sim.j;i<n;i++){rings[i].broken=true;ringBurst(rings[i],m,col(rings[i].k))}
   S.j=n;S.t=sim.t;S.spdMult=sim.spdMult;S.gAng=sim.gAng;
   finish(0);return;
  }
 }
 S.j=sim.j;S.t=sim.t;S.spdMult=sim.spdMult;S.gAng=sim.gAng;
 for(const rg of rings)if(rg.flash>0)rg.flash=Math.max(0,rg.flash-dt*5);
 for(const b of balls){b.trail.push({x:b.x,y:b.y,r:b.r});if(b.trail.length>24)b.trail.shift()}
}

function draw(){
 const m=M[S.mode];
 ctx.fillStyle=pal.bg;ctx.fillRect(0,0,W,H);

 let fs=Math.max(14,Math.min(W*.05,H*.032,32));
 const words=$('title').value.replace('{T}',S.T).trim().split(/\s+/),last=words.pop()||'',head=words.join(' ')+(words.length?' ':'');
 ctx.font=`italic 900 ${fs}px system-ui,sans-serif`;
 let w1=ctx.measureText(head).width,w2=ctx.measureText(last).width;
 if(w1+w2>W*.92){
  fs=fs*(W*.92)/(w1+w2);
  ctx.font=`italic 900 ${fs}px system-ui,sans-serif`;
  w1=ctx.measureText(head).width;w2=ctx.measureText(last).width;
 }
 ctx.textAlign='left';ctx.textBaseline='middle';
 const tx=cx-(w1+w2)/2,ty=cy-R-fs*2.7;
 ctx.fillStyle='#fff';ctx.fillText(head,tx,ty);ctx.fillStyle=pal.acc;ctx.fillText(last,tx+w1,ty);

 const rem=Math.max(0,S.T-S.t),sec=Math.floor(rem),cs=Math.floor((rem-sec)*100);
 const urgent=S.state==='run'&&rem<=3&&rem>0;
 const tScale=urgent?(1+Math.sin(rem*18)*.05):1;
 ctx.textAlign='center';
 ctx.font=`800 ${fs*1.28*tScale}px ui-monospace,SFMono-Regular,Menlo,monospace`;
 let timerTxt=`${String(sec).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
 let timerCol=urgent?'#ff5c7a':'#fff';
 if(S.state==='done'){
  if(m.duel&&S.winner>=0){timerTxt=`${DUEL_NAMES[S.winner]} WINS!`;timerCol=DUEL_COLS[S.winner]}
  else timerTxt='ESCAPED!';
 }
 ctx.fillStyle=timerCol;
 ctx.fillText(timerTxt,cx,ty+fs*1.55);

 let badge='';
 if(m.speed)badge=`⚡ SPEED ${S.spdMult.toFixed(1)}x`;
 else if(m.clone)badge=`✴ BALLS: ${balls.length}`;
 else if(m.duel)badge=`CYAN  VS  PINK`;
 else if(m.grav){const gi=((Math.round(S.gAng/(PI/2))%4)+4)%4;badge=`GRAVITY ${['→','↓','←','↑'][gi]}`}
 else if(m.hits&&S.j<n)badge=`💥 HITS: ${rings[S.j].hp}`;
 else if(m.flip)badge=`🔄 REVERSE ON BOUNCE`;
 if(S.dens>1||S.bam){
  const extra=[S.bam?'💥 BAM-REVERSE':'',S.dens>1?`LAYERS: ${n-S.j}`:''].filter(Boolean).join(' • ');
  badge=badge?(badge+' • '+extra):extra;
 }
 if(badge){
  ctx.font=`700 ${Math.max(11,fs*.54)}px system-ui,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,.72)';
  ctx.fillText(badge,cx,cy+R+Math.max(22,fs*1.15));
 }

 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake,z=1+bamPulse*.05;
 ctx.save();ctx.translate(cx+sx,cy+sy);ctx.scale(z,z);ctx.lineCap='round';ctx.lineWidth=th*R;

 for(const w of waves){
  ctx.globalAlpha=Math.max(0,w.l*.55);
  ctx.strokeStyle=w.c;ctx.lineWidth=Math.max(1.5,th*R*.5*w.l);
  ctx.beginPath();ctx.arc(0,0,w.r*R,0,TAU);ctx.stroke();
 }
 ctx.globalAlpha=1;ctx.lineWidth=th*R;

 for(let i=S.j;i<n;i++){
  const rg=rings[i],c0=rg.a,baseCol=col(rg.k);
  ctx.strokeStyle=rg.flash>.2?`rgba(255,255,255,${.45+rg.flash*.55})`:baseCol;
  ctx.shadowColor=baseCol;ctx.shadowBlur=th*R*(S.dens>2?.75:(1.1+rg.flash*.8));
  if(m.g===0){
   ctx.lineWidth=th*R*(.45+.55*(rg.hp/rg.maxHp));
   ctx.beginPath();ctx.arc(0,0,rg.r*R,0,TAU);ctx.stroke();
   const dmg=rg.maxHp-rg.hp;
   if(dmg>0){
    ctx.shadowBlur=0;ctx.strokeStyle=pal.bg;ctx.lineWidth=Math.max(2,th*R*.45);
    for(let c=0;c<dmg;c++){
     const ca=rg.a+c*(TAU/rg.maxHp);
     ctx.beginPath();ctx.moveTo(Math.cos(ca)*(rg.r-th*.8)*R,Math.sin(ca)*(rg.r-th*.8)*R);
     ctx.lineTo(Math.cos(ca+.04)*(rg.r+th*.8)*R,Math.sin(ca+.04)*(rg.r+th*.8)*R);ctx.stroke();
    }
   }
   ctx.lineWidth=th*R;
  }else{
   for(let g=0;g<m.g;g++){const c=c0+g*TAU/m.g;ctx.beginPath();ctx.arc(0,0,rg.r*R,c+rg.hv,c+TAU/m.g-rg.hv);ctx.stroke()}
  }
 }
 ctx.shadowBlur=0;

 for(const b of balls){
  const bCol=m.duel?DUEL_COLS[b.colIdx]:(m.grow?'#ffffff':pal.ball);
  for(let i=0;i<b.trail.length;i++){
   const p=b.trail[i],k=(i+1)/b.trail.length;
   ctx.globalAlpha=k*(m.speed?.42:.3);ctx.fillStyle=bCol;
   ctx.beginPath();ctx.arc(p.x*R,p.y*R,p.r*R*(.35+k*.62),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(Math.hypot(b.x,b.y)<2.8){
   const bx=b.x*R,by=b.y*R,br=b.r*R;
   if(m.grow){
    ctx.shadowColor='#fff';ctx.shadowBlur=br*.9;ctx.fillStyle='#05050b';ctx.beginPath();ctx.arc(bx,by,br,0,TAU);ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,R*.01);ctx.stroke();
   }else{
    ctx.shadowColor=bCol;ctx.shadowBlur=br*(m.speed?1.9:1.4);ctx.fillStyle=bCol;ctx.beginPath();ctx.arc(bx,by,br,0,TAU);ctx.fill();ctx.shadowBlur=0;
   }
  }
 }

 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x*R,p.y*R,p.sz*p.l+1,0,TAU);ctx.fill()}
 ctx.globalAlpha=1;ctx.restore();
}

let lastT=performance.now();
function tickFrame(now){
 const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 shake=Math.max(0,shake-dt*26);
 bamPulse=Math.max(0,bamPulse-dt*6.5);
 waves=waves.filter(w=>(w.r+=(w.maxR-w.r)*Math.min(1,dt*8),w.l-=dt*2.4,w.l>0));
 if(S.state==='run')step(dt);
 else{
  S.done+=dt;
  const gx=Math.cos(S.gAng)*G,gy=Math.sin(S.gAng)*G;
  for(const b of balls){
   b.vx+=gx*dt;b.vy+=gy*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
   b.trail.push({x:b.x,y:b.y,r:b.r});if(b.trail.length>24)b.trail.shift();
  }
  if(recording&&!recStopping){
   if(recMode==='join'){if(S.done>=2.2)nextRound()}
   else if(S.done>=1.6)stopRec(false);
  }else if(!recording&&$('auto').checked&&S.done>=2.4)nextRound();
 }
 const dn=S.state==='done';
 parts=parts.filter(p=>(p.x+=p.vx*dt,p.y+=p.vy*dt,p.vy+=(dn?G*.45:.25)*dt,p.l-=dt*p.fade*(dn?.45:1),p.l>0));
 draw();
}

function rafLoop(now){if(!document.hidden)tickFrame(now);requestAnimationFrame(rafLoop)}
wk.onmessage=()=>{if(document.hidden)tickFrame(performance.now())};
document.addEventListener('visibilitychange',()=>{
 lastT=performance.now();
 wk.postMessage(document.hidden?'start':'stop');
 if(!document.hidden)unlockAudio();
});

addEventListener('pointerdown',unlockAudio);
addEventListener('keydown',unlockAudio);
addEventListener('resize',resize);
$('gear').onclick=()=>$('ui').classList.toggle('hide');
$('rst').onclick=()=>start(false);
$('col').onclick=()=>newPal();
$('vert').onchange=resize;
$('sec').onchange=()=>start(false);
$('title').oninput=()=>{S.autoHook=false};
$('hookBtn').onclick=()=>{S.autoHook=true;applyHook(true)};
$('bamBtn').onclick=()=>{S.bam=!S.bam;$('bamBtn').classList.toggle('on',S.bam);start(false)};
$('spiralBtn').onclick=()=>{S.spiral=!S.spiral;$('spiralBtn').classList.toggle('on',S.spiral);start(false)};
document.querySelectorAll('#presets [data-d]').forEach(b=>b.onclick=()=>{
 S.dens=+b.dataset.d;
 document.querySelectorAll('#presets [data-d]').forEach(x=>x.classList.toggle('on',x===b));
 start(false);
});
$('recBtn').onclick=()=>recording?stopRec(true):startRec();
document.querySelectorAll('#recRow [data-rm]').forEach(b=>b.onclick=()=>{
 recMode=b.dataset.rm;
 document.querySelectorAll('#recRow [data-rm]').forEach(x=>x.classList.toggle('on',x===b));
});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('sec').value=b.dataset.s;start(false)});
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
 setModeUI(b.dataset.m);start(true);
});

resize();newPal();start(false);requestAnimationFrame(rafLoop);
</script></body></html>
